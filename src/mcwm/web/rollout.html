<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minecraft Latent World</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f7ef;
      --muted: #9da99a;
      --line: rgba(255, 255, 255, .11);
      --panel: rgba(17, 22, 18, .88);
      --green: #8fd05f;
      --green-dark: #172615;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% -20%, #30442b 0, transparent 44%),
        linear-gradient(150deg, #101510, #080b09 70%);
      color: var(--ink);
      font: 500 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .app {
      width: min(980px, 100%);
      height: 100dvh;
      margin: 0 auto;
      padding: 14px clamp(12px, 2vw, 24px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 11px;
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .eyebrow { color: var(--green); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 3px 0 0; font: 650 clamp(18px, 2.3vw, 28px)/1.1 system-ui, sans-serif; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .badge, button {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      color: var(--ink);
      padding: 8px 11px;
      font: inherit;
    }
    .badge.live { border-color: rgba(143, 208, 95, .5); color: var(--green); }
    .stage {
      min-height: 0;
      width: min(100%, calc(100dvh - 164px));
      max-height: 100%;
      aspect-ratio: 1;
      justify-self: center;
      position: relative;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: #050705;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .4);
      cursor: crosshair;
      outline: none;
    }
    #frame {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: auto;
      user-select: none;
      -webkit-user-drag: none;
    }
    .crosshair {
      position: absolute;
      left: 50%; top: 50%;
      width: 14px; height: 14px;
      transform: translate(-50%, -50%);
      opacity: .65;
      pointer-events: none;
    }
    .crosshair::before, .crosshair::after {
      content: ""; position: absolute; background: white;
      box-shadow: 0 0 2px black;
    }
    .crosshair::before { width: 14px; height: 2px; top: 6px; }
    .crosshair::after { width: 2px; height: 14px; left: 6px; }
    .hint {
      position: absolute;
      inset: auto 14px 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }
    .hint span {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(4, 7, 5, .76);
      backdrop-filter: blur(8px);
      padding: 7px 9px;
      color: var(--muted);
    }
    .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    footer { display: grid; gap: 7px; min-width: 0; }
    .footer-main { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .divider { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
    button { cursor: pointer; transition: border-color .15s, background .15s; }
    button:hover { border-color: var(--green); background: var(--green-dark); }
    button.primary { background: var(--green); color: #10180d; border-color: var(--green); font-weight: 750; }
    .meta {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    kbd { color: var(--ink); }
    @media (max-width: 700px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100dvh; padding: 10px; gap: 9px; }
      header { align-items: flex-start; flex-direction: column; }
      .badges { justify-content: flex-start; }
      .stage { width: 100%; }
      .footer-main { align-items: flex-start; flex-direction: column; }
      .hint { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <div class="eyebrow">Tiny latent world model</div>
        <h1>Minecraft imagined rollout</h1>
      </div>
      <div class="badges">
        <span class="badge" id="step">t+0</span>
        <span class="badge" id="action">IDLE</span>
        <span class="badge" id="status">READY</span>
      </div>
    </header>

    <main class="stage" id="stage" tabindex="0" aria-label="Imagined Minecraft viewport">
      <img id="frame" alt="Current imagined Minecraft frame">
      <div class="crosshair"></div>
      <div class="hint">
        <span><kbd>WASD</kbd> move · <kbd>Shift</kbd> sprint · <kbd>Space</kbd> jump</span>
        <span>Click view for mouse look · <kbd>Esc</kbd> releases</span>
      </div>
    </main>

    <footer>
      <div class="footer-main">
        <div class="controls">
          <button id="previous-seed">← Seed</button>
          <button id="random-seed">Random</button>
          <button id="next-seed">Seed →</button>
          <span class="divider" aria-hidden="true"></span>
          <button class="primary" id="pause">Start idle</button>
          <button id="reset">Reset</button>
          <button id="capture">Mouse</button>
        </div>
        <button id="stop">Stop server</button>
      </div>
      <div class="meta" id="meta">Loading model state…</div>
    </footer>
  </div>

  <script>
    const frame = document.querySelector('#frame');
    const stage = document.querySelector('#stage');
    const statusEl = document.querySelector('#status');
    const stepEl = document.querySelector('#step');
    const actionEl = document.querySelector('#action');
    const pauseButton = document.querySelector('#pause');
    const metaEl = document.querySelector('#meta');
    const held = new Set();
    let running = false;
    let pending = false;
    let mouseDx = 0;
    let mouseDy = 0;
    let frameUrl = null;
    let timer = null;
    let info = null;

    const keyMap = {
      KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd',
      Space: 'jump', ShiftLeft: 'sprint', ShiftRight: 'sprint',
      ControlLeft: 'sneak', ControlRight: 'sneak',
      ArrowLeft: 'look_left', ArrowRight: 'look_right',
      ArrowUp: 'look_up', ArrowDown: 'look_down'
    };

    function setRunning(value) {
      running = value;
      statusEl.textContent = running ? 'RUNNING' : 'PAUSED';
      statusEl.classList.toggle('live', running);
      pauseButton.textContent = running ? 'Pause' : 'Start idle';
    }

    function showInfo(value) {
      info = value;
      metaEl.textContent = `seed ${info.seed_index + 1} of ${info.seed_count} · ` +
        `${info.episode} · frame ${info.seed_step} · ${info.device}`;
      metaEl.title = metaEl.textContent;
    }

    function showFrame(blob, response) {
      if (frameUrl) URL.revokeObjectURL(frameUrl);
      frameUrl = URL.createObjectURL(blob);
      frame.src = frameUrl;
      const step = response.headers.get('X-Rollout-Step') || '0';
      const action = response.headers.get('X-Rollout-Action');
      stepEl.textContent = `t+${step}`;
      if (action) actionEl.textContent = action;
    }

    async function getFrame(path, options = {}) {
      const response = await fetch(path, options);
      if (!response.ok) throw new Error(await response.text());
      showFrame(await response.blob(), response);
    }

    async function tick() {
      if (!running || pending) return;
      pending = true;
      const dx = mouseDx;
      const dy = mouseDy;
      mouseDx = 0;
      mouseDy = 0;
      try {
        await getFrame('/api/step', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({controls: [...held], mouse_dx: dx, mouse_dy: dy})
        });
      } catch (error) {
        setRunning(false);
        statusEl.textContent = 'ERROR';
        console.error(error);
      } finally {
        pending = false;
      }
    }

    async function selectSeed(index) {
      if (pending || !info) return;
      pending = true;
      setRunning(false);
      held.clear();
      mouseDx = mouseDy = 0;
      statusEl.textContent = 'LOADING';
      try {
        const response = await fetch('/api/seed', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({index})
        });
        if (!response.ok) throw new Error(await response.text());
        showInfo(await response.json());
        await getFrame('/api/frame');
        actionEl.textContent = 'IDLE';
        statusEl.textContent = 'READY';
      } catch (error) {
        statusEl.textContent = 'ERROR';
        console.error(error);
      } finally {
        pending = false;
      }
    }

    window.addEventListener('keydown', event => {
      const control = keyMap[event.code];
      if (control) {
        event.preventDefault();
        held.add(control);
        setRunning(true);
      } else if (event.code === 'KeyP') {
        setRunning(!running);
      } else if (event.code === 'KeyR') {
        document.querySelector('#reset').click();
      }
    });
    window.addEventListener('keyup', event => {
      const control = keyMap[event.code];
      if (control) held.delete(control);
    });
    window.addEventListener('blur', () => held.clear());
    document.addEventListener('mousemove', event => {
      if (document.pointerLockElement === stage) {
        mouseDx += event.movementX;
        mouseDy += event.movementY;
        setRunning(true);
      }
    });
    document.addEventListener('pointerlockchange', () => {
      document.querySelector('#capture').textContent =
        document.pointerLockElement === stage ? 'Mouse on' : 'Mouse';
    });
    stage.addEventListener('click', () => stage.requestPointerLock());
    document.querySelector('#capture').addEventListener('click', () => stage.requestPointerLock());
    pauseButton.addEventListener('click', () => setRunning(!running));
    document.querySelector('#previous-seed').addEventListener('click', () => {
      if (!info) return;
      const jump = Math.max(1, Math.floor(info.seed_count / 100));
      selectSeed((info.seed_index - jump + info.seed_count) % info.seed_count);
    });
    document.querySelector('#next-seed').addEventListener('click', () => {
      if (!info) return;
      const jump = Math.max(1, Math.floor(info.seed_count / 100));
      selectSeed((info.seed_index + jump) % info.seed_count);
    });
    document.querySelector('#random-seed').addEventListener('click', () => {
      if (!info || info.seed_count < 2) return;
      let index = Math.floor(Math.random() * info.seed_count);
      if (index === info.seed_index) index = (index + 1) % info.seed_count;
      selectSeed(index);
    });
    document.querySelector('#reset').addEventListener('click', async () => {
      setRunning(false);
      held.clear();
      mouseDx = mouseDy = 0;
      await getFrame('/api/reset', {method: 'POST'});
      actionEl.textContent = 'IDLE';
      statusEl.textContent = 'READY';
    });
    document.querySelector('#stop').addEventListener('click', async () => {
      setRunning(false);
      await fetch('/api/stop', {method: 'POST'});
      statusEl.textContent = 'STOPPED';
    });

    async function initialize() {
      showInfo(await fetch('/api/info').then(response => response.json()));
      await getFrame('/api/frame');
      timer = setInterval(tick, 1000 / info.model_fps);
      statusEl.textContent = 'READY';
      stage.focus();
    }
    window.addEventListener('beforeunload', () => {
      if (timer) clearInterval(timer);
      if (frameUrl) URL.revokeObjectURL(frameUrl);
    });
    initialize().catch(error => {
      statusEl.textContent = 'ERROR';
      console.error(error);
    });
  </script>
</body>
</html>
