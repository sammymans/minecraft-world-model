[project]
name = "minecraft-world-model"
version = "0.1.0"
description = "A tiny latent world model for Minecraft"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=1.26",
    "opencv-python-headless>=5.0.0.93",
    "pyglet>=2.1.16",
    "torch>=2.6",
]

[project.scripts]
mcwm = "mcwm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcwm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
